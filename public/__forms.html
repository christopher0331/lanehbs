<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lane HBS Forms</title>
  </head>
  <body>
    <form name="estimate" method="POST" data-netlify="true" netlify-honeypot="bot_check" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
      <input type="text" name="page" />
      <input type="text" name="bot_check" />
    </form>
  </body>
</html>
